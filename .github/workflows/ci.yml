name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # HTML·CSS 검사기(vnu)가 Java로 실행됨
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 로컬과 같은 검사를 실행 (도구 버전은 deploy.sh에 고정)
      - run: ./deploy.sh check
